<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Nutrition diary</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/app.js" defer></script>
</head>
<body>
<main>
  <header><div><span class="eyebrow">NUTRITION DIARY</span><h1 id="heading">Your day in food</h1></div></header>
  <p id="status" role="status">Opening your diary…</p>
  <section id="dashboard" hidden>
    <div class="day-picker"><button id="previous" aria-label="Previous day">←</button><label><span id="date-label">Day</span><input id="date" type="date"></label><button id="next" aria-label="Next day">→</button></div>
    <section class="hero"><span id="day-title">Today</span><div><strong id="calories">0</strong> <span id="unit">kcal</span></div><p id="count"></p><div class="macros"><div><b id="protein">0</b><span id="protein-label">Protein, g</span></div><div><b id="carbs">0</b><span id="carbs-label">Carbs, g</span></div><div><b id="fat">0</b><span id="fat-label">Fat, g</span></div></div></section>
    <section class="panel"><h2 id="fiber-label">Dietary fiber</h2><p id="fiber"></p><p class="muted" id="fiber-note"></p></section>
    <section class="panel"><div class="section-heading"><h2 id="history-title">Daily calories</h2><select id="range" aria-label="History period"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option></select></div><div id="chart" aria-label="Daily calories chart"></div><p class="muted" id="average"></p></section>
    <section class="panel"><h2 id="meals-title">Meals</h2><div id="meals"></div></section>
    <footer id="footnote">Estimates, not a calorie target. Days without entries do not mean you ate nothing.</footer>
  </section>
</main>
</body>
</html>
